name: Daily Crawler Translate and AI Generate

on:
  schedule:
    # 每天早上执行一次（UTC 时间，北京时间 = UTC+8）
    # 北京时间每天早上 8:00 = UTC 00:00
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 允许手动触发
    inputs:
      run_translate:
        description: '是否执行翻译任务'
        required: false
        default: 'true'
        type: boolean
      run_ai_generate:
        description: '是否执行 AI 生成描述任务'
        required: false
        default: 'true'
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  crawl-translate-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          echo "=== 开始执行爬虫任务 ==="
          python main.py

      - name: Run translation
        if: github.event.inputs.run_translate != 'false'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          echo "=== 开始执行翻译任务 ==="
          python scripts/translate_news.py --limit 100 --concurrent 1

      - name: Run AI generate
        if: github.event.inputs.run_ai_generate != 'false'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: |
          echo "=== 开始执行 AI 生成描述任务 ==="
          python scripts/run_ai_generate.py --limit 100

      - name: Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-logs
          path: logs/
          retention-days: 7